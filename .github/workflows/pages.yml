name: Vista previa en GitHub Pages

# Publica la rama web-astro en GitHub Pages para enseñarla como ejemplo.
# El formulario no envía mensajes ahí, porque Pages no ejecuta /api/contacto.
on:
  push:
    branches: [web-astro]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # Sin Tina Cloud y sin /admin: la vista previa no se puede editar.
      - run: npm run build:sin-admin
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}

      - run: node scripts/github-pages.mjs
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
